<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <h1>Prompting and Greeting</h1>
</head>
<body>
    <p id="target"></p>
    <script>
       name = prompt("Enter your name!")
       document.querySelector("#target").innerHTML =
        "Hello, " + name + "!";
    </script>
</body>
</html>
